<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Md Abdus Sobhan</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e3a8a);
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .container {
        max-width: 700px;
        padding: 2rem;
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 0.5rem;
    }

    h2 {
        font-size: 1.3rem;
        font-weight: 400;
        color: #cbd5e1;
        margin-bottom: 1.5rem;
    }

    p {
        line-height: 1.7;
        margin-bottom: 2rem;
        color: #e2e8f0;
    }

    .links a {
        display: inline-block;
        margin: 0.5rem;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
    }

    .github {
        background: #24292e;
        color: white;
    }

    .linkedin {
        background: #0A66C2;
        color: white;
    }

    .links a:hover {
        transform: translateY(-3px);
    }
</style>
</head>
<body>

<div class="container">
    <h1>Md Abdus Sobhan</h1>
    <h2>Manager (Sr. Software Engineer)</h2>

    <p>
        Welcome to my personal website. I am passionate about software
        engineering, enterprise solutions, cloud technologies, and digital
        transformation. Explore my work, projects, and professional journey.
    </p>

    <div class="links">
        <a class="github" href="https://github.com/masiceiu" target="_blank">
            GitHub
        </a>

        https://linkedin.com/in/masiceiu
    </div>
</div>

</body>
</html>
